name: Sync Docker Hub description

# Pushes DOCKERHUB.md to the "Repository overview" field on Docker Hub
# whenever the file changes on main, so the published page stays in sync
# with the repo without manual copy-paste.
#
# Reuses the same secrets the publish workflow uses:
#   DOCKERHUB_USERNAME -> fennch
#   DOCKERHUB_TOKEN    -> Docker Hub access token with read+write on the
#                         goatlab repo.

on:
  push:
    branches: [main]
    paths:
      - DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

jobs:
  sync:
    name: Push README to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: fennch/goatlab
          short-description: "Multi-tenant goat-farm management — herd, health, breeding, milk, sales, pedigree. Self-host."
          readme-filepath: ./DOCKERHUB.md
