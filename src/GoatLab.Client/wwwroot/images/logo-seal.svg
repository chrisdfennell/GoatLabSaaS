<?xml version="1.0" encoding="UTF-8"?>
<!--
  GoatLab heritage seal — circular badge with "GOATLAB" arching over the
  watercolor goat from goat.svg. The goat is composed via xlink:href so we
  don't duplicate its (heavy) path data.

  Use this as the brand "lockup" wherever you want the goat + name as one
  piece: landing-page header, splash screen, footer brand row, marketing
  cards. The PWA icons deliberately do NOT include text so they stay
  readable at favicon size — those are generated from logo-icon.svg.

  The goat reference is relative; keep this file in the same directory as
  goat.svg or update the href.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sealBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>

    <!-- Top arc for the curved GOATLAB text. Goes from left (88, 256) to
         right (424, 256) via the top of the circle, clockwise. Text baseline
         sits on this path with character bodies pointing outward. -->
    <path id="topArc" d="M 88 256 A 168 168 0 0 1 424 256" fill="none"/>
  </defs>

  <!-- Outer green disk -->
  <circle cx="256" cy="256" r="248" fill="url(#sealBg)"/>

  <!-- Heritage double border -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#a5d6a7" stroke-width="3" opacity="0.85"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#a5d6a7" stroke-width="1" opacity="0.55"/>

  <!-- The goat (centered, sized to leave room for the curved text and tagline) -->
  <image xlink:href="goat.svg" x="120" y="150" width="272" height="272"/>

  <!-- Curved GOATLAB along the top arc -->
  <text fill="#ffffff" font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="700" letter-spacing="12">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">GOATLAB</textPath>
  </text>

  <!-- Ornamental four-point stars at 9 and 3 o'clock to bracket the curved text -->
  <g fill="#a5d6a7">
    <path d="M 76 248 L 79 255 L 86 256 L 79 257 L 76 264 L 73 257 L 66 256 L 73 255 Z"/>
    <path d="M 436 248 L 439 255 L 446 256 L 439 257 L 436 264 L 433 257 L 426 256 L 433 255 Z"/>
  </g>

  <!-- Tagline below the goat, straight (much more reliable than a bottom textPath) -->
  <text x="256" y="468" text-anchor="middle"
        fill="#a5d6a7" font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="600" letter-spacing="6">FARM &#183; LAB</text>
</svg>
